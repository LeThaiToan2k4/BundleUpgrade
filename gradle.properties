# Gradle daemon settings
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Force the Gradle daemon onto JDK 21 (system default is a newer JDK that Minecraft 1.21.11 tooling does not target)
org.gradle.java.home=D:/Java/Java-21

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.14.10

# Mod Properties
mod_version=1.0.0
maven_group=com.thaistoanf
archives_base_name=bundleupgrade

# Dependencies
fabric_api_version=0.141.6+1.21.11
