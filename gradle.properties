# Gradle daemon settings
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Force the Gradle daemon onto JDK 17 (system default is a newer JDK that Minecraft 1.20.4 tooling does not target)
org.gradle.java.home=D:\\Java\\Java-17

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.20.1
loom_version=1.7.4

# Mod Properties
mod_version=1.0.0
maven_group=com.thaistoanf
archives_base_name=bundleupgrade

# Dependencies
fabric_api_version=0.97.3+1.20.4
